<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GateKeeper{% endblock %}</title>
    
    <!-- TailwindCSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <style>
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <!-- Navigation -->
    {% if show_nav %}
    <div class="navbar bg-base-100 shadow-lg">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost text-xl">GateKeeper</a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1">
                <li><a href="/events">Events</a></li>
                <li><a href="/scanner">QR Scanner</a></li>
                <li><a href="/admin">Admin</a></li>
            </ul>
        </div>
    </div>
    {% endif %}
    
    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="footer footer-center p-4 bg-base-300 text-base-content mt-8">
        <aside>
            <p>GateKeeper Event Management System | Built for chaos. Designed for real events.</p>
        </aside>
    </footer>
    
    <!-- Custom JS -->
    <script>
        // Theme Management Functions (for public pages)
        window.themeManager = {
            getTheme: function() {
                return localStorage.getItem('app-theme') || 'light';
            },
            
            setTheme: function(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('app-theme', theme);
            },
            
            toggleTheme: function() {
                const currentTheme = this.getTheme();
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                this.setTheme(newTheme);
            },
            
            init: function() {
                const theme = this.getTheme();
                this.setTheme(theme);
            }
        };

        // Initialize theme when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                window.themeManager.init();
            });
        } else {
            window.themeManager.init();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
