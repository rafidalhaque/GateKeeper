{% extends "admin/base.html" %}

{% block title %}Image Library - GateKeeper Admin{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">Image Library</h1>
        <button onclick="openUploadModal()" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Upload Image
        </button>
    </div>

    <!-- Filter -->
    <div class="mb-4">
        <label class="label">
            <span class="label-text">Filter by usage:</span>
        </label>
        <select id="usageFilter" class="select select-bordered w-full max-w-xs" onchange="filterImages()">
            <option value="">All Images</option>
            <option value="email">Email Templates</option>
            <option value="ticket">Tickets</option>
            <option value="token">Tokens</option>
            <option value="all">All Templates</option>
        </select>
    </div>

    <!-- Loading State -->
    <div id="loading" class="flex justify-center items-center py-12" style="display: none;">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-12" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mx-auto text-base-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <p class="text-lg text-base-content/50">No images uploaded yet</p>
        <button onclick="openUploadModal()" class="btn btn-primary mt-4">Upload Your First Image</button>
    </div>

    <!-- Images Grid -->
    <div id="imagesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <!-- Images will be loaded here -->
    </div>
</div>

<!-- Upload Modal -->
<div id="uploadModal" class="modal">
    <div class="modal-box max-w-2xl">
        <h3 class="font-bold text-lg mb-4">Upload Image</h3>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Image File *</span>
                    <span class="label-text-alt text-base-content/50">Max 5MB (PNG, JPG, GIF, SVG)</span>
                </label>
                <input type="file" id="imageFile" name="file" accept="image/*" class="file-input file-input-bordered w-full" required>
            </div>

            <!-- Image Preview -->
            <div id="imagePreview" class="mb-4" style="display: none;">
                <label class="label">
                    <span class="label-text">Preview:</span>
                </label>
                <img id="previewImg" class="max-w-full h-auto max-h-64 rounded-lg border" alt="Preview">
            </div>

            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Description</span>
                </label>
                <input type="text" id="description" name="description" placeholder="e.g., Company Logo" class="input input-bordered w-full">
            </div>

            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Usage Type</span>
                </label>
                <select id="usageType" name="usage_type" class="select select-bordered w-full">
                    <option value="all">All Templates (Email, Ticket, Token)</option>
                    <option value="email">Email Templates Only</option>
                    <option value="ticket">Tickets Only</option>
                    <option value="token">Tokens Only</option>
                </select>
            </div>

            <div class="modal-action">
                <button type="button" onclick="closeUploadModal()" class="btn btn-ghost">Cancel</button>
                <button type="submit" class="btn btn-primary" id="uploadBtn">
                    <span id="uploadBtnText">Upload</span>
                    <span id="uploadBtnLoading" class="loading loading-spinner loading-sm" style="display: none;"></span>
                </button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button onclick="closeUploadModal()">close</button>
    </form>
</div>

<!-- Image Details Modal -->
<div id="detailsModal" class="modal">
    <div class="modal-box max-w-4xl">
        <h3 class="font-bold text-lg mb-4">Image Details</h3>

        <div id="detailsContent">
            <!-- Details will be loaded here -->
        </div>

        <div class="modal-action">
            <button onclick="closeDetailsModal()" class="btn">Close</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button onclick="closeDetailsModal()">close</button>
    </form>
</div>

<script>
let currentImages = [];
let selectedImage = null;

// Load images on page load
document.addEventListener('DOMContentLoaded', () => {
    loadImages();

    // Setup file input preview
    document.getElementById('imageFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('imagePreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // Setup upload form
    document.getElementById('uploadForm').addEventListener('submit', handleUpload);
});

async function loadImages(usageType = '') {
    const loading = document.getElementById('loading');
    const emptyState = document.getElementById('emptyState');
    const grid = document.getElementById('imagesGrid');

    loading.style.display = 'flex';
    emptyState.style.display = 'none';
    grid.innerHTML = '';

    try {
        const url = usageType ? `/api/attachments/?usage_type=${usageType}` : '/api/attachments/';
        const response = await fetch(url);
        const data = await response.json();

        if (data.success) {
            currentImages = data.attachments;

            if (currentImages.length === 0) {
                emptyState.style.display = 'block';
            } else {
                renderImages(currentImages);
            }
        } else {
            showToast('Failed to load images', 'error');
        }
    } catch (error) {
        console.error('Error loading images:', error);
        showToast('Error loading images', 'error');
    } finally {
        loading.style.display = 'none';
    }
}

function renderImages(images) {
    const grid = document.getElementById('imagesGrid');
    grid.innerHTML = '';

    images.forEach(img => {
        const card = document.createElement('div');
        card.className = 'card bg-base-100 shadow-xl hover:shadow-2xl transition-shadow';
        card.innerHTML = `
            <figure class="px-4 pt-4">
                <img src="${img.url}" alt="${img.description || img.original_filename}" class="rounded-lg h-48 w-full object-cover cursor-pointer" onclick="showDetails('${img.id}')">
            </figure>
            <div class="card-body p-4">
                <h2 class="card-title text-sm truncate" title="${img.original_filename}">${img.original_filename}</h2>
                <div class="text-xs text-base-content/70 space-y-1">
                    <p><strong>Size:</strong> ${formatFileSize(img.file_size)}</p>
                    <p><strong>Usage:</strong> ${formatUsageType(img.usage_type)}</p>
                    ${img.description ? `<p><strong>Description:</strong> ${img.description}</p>` : ''}
                </div>
                <div class="card-actions justify-between mt-2">
                    <button onclick="showDetails('${img.id}')" class="btn btn-sm btn-primary">View Details</button>
                    <button onclick="deleteImage('${img.id}')" class="btn btn-sm btn-error btn-outline">Delete</button>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function filterImages() {
    const filter = document.getElementById('usageFilter').value;
    loadImages(filter);
}

function openUploadModal() {
    document.getElementById('uploadModal').classList.add('modal-open');
}

function closeUploadModal() {
    document.getElementById('uploadModal').classList.remove('modal-open');
    document.getElementById('uploadForm').reset();
    document.getElementById('imagePreview').style.display = 'none';
}

async function handleUpload(e) {
    e.preventDefault();

    const btn = document.getElementById('uploadBtn');
    const btnText = document.getElementById('uploadBtnText');
    const btnLoading = document.getElementById('uploadBtnLoading');

    btn.disabled = true;
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline-block';

    try {
        const formData = new FormData(e.target);

        const response = await fetch('/api/attachments/upload', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            showToast('Image uploaded successfully', 'success');
            closeUploadModal();
            loadImages();
        } else {
            showToast(data.error || 'Failed to upload image', 'error');
        }
    } catch (error) {
        console.error('Upload error:', error);
        showToast('Error uploading image', 'error');
    } finally {
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
    }
}

async function showDetails(imageId) {
    selectedImage = currentImages.find(img => img.id === imageId);
    if (!selectedImage) return;

    const content = document.getElementById('detailsContent');
    content.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <img src="${selectedImage.url}" alt="${selectedImage.description || selectedImage.original_filename}" class="w-full rounded-lg shadow-lg">
            </div>
            <div class="space-y-4">
                <div>
                    <h4 class="font-semibold mb-2">File Information</h4>
                    <dl class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <dt class="text-base-content/70">Filename:</dt>
                            <dd class="font-medium">${selectedImage.original_filename}</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-base-content/70">Size:</dt>
                            <dd class="font-medium">${formatFileSize(selectedImage.file_size)}</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-base-content/70">Type:</dt>
                            <dd class="font-medium">${selectedImage.content_type}</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-base-content/70">Usage:</dt>
                            <dd class="font-medium">${formatUsageType(selectedImage.usage_type)}</dd>
                        </div>
                        <div class="flex justify-between">
                            <dt class="text-base-content/70">Uploaded:</dt>
                            <dd class="font-medium">${new Date(selectedImage.created_at).toLocaleDateString()}</dd>
                        </div>
                    </dl>
                </div>

                <div class="divider"></div>

                <div>
                    <h4 class="font-semibold mb-2">Usage in Templates</h4>

                    <!-- Email Template -->
                    <div class="mb-4">
                        <label class="label">
                            <span class="label-text font-medium">For Email Templates (CID):</span>
                        </label>
                        <div class="flex gap-2">
                            <input type="text" value='<img src="cid:${selectedImage.cid}" alt="${selectedImage.description || selectedImage.original_filename}" />' class="input input-bordered input-sm flex-1 font-mono text-xs" readonly id="emailCode">
                            <button onclick="copyToClipboard('emailCode')" class="btn btn-sm btn-outline">Copy</button>
                        </div>
                    </div>

                    <!-- Ticket/Token Template -->
                    <div class="mb-4">
                        <label class="label">
                            <span class="label-text font-medium">For Ticket/Token Templates:</span>
                        </label>
                        <div class="flex gap-2">
                            <input type="text" value='<img src="${selectedImage.url}" alt="${selectedImage.description || selectedImage.original_filename}" />' class="input input-bordered input-sm flex-1 font-mono text-xs" readonly id="ticketCode">
                            <button onclick="copyToClipboard('ticketCode')" class="btn btn-sm btn-outline">Copy</button>
                        </div>
                    </div>

                    <!-- Direct URL -->
                    <div class="mb-4">
                        <label class="label">
                            <span class="label-text font-medium">Direct URL:</span>
                        </label>
                        <div class="flex gap-2">
                            <input type="text" value="${window.location.origin}${selectedImage.url}" class="input input-bordered input-sm flex-1 font-mono text-xs" readonly id="directUrl">
                            <button onclick="copyToClipboard('directUrl')" class="btn btn-sm btn-outline">Copy</button>
                        </div>
                    </div>

                    <!-- CID Only -->
                    <div class="mb-4">
                        <label class="label">
                            <span class="label-text font-medium">Content ID (CID) Only:</span>
                        </label>
                        <div class="flex gap-2">
                            <input type="text" value="${selectedImage.cid}" class="input input-bordered input-sm flex-1 font-mono text-xs" readonly id="cidOnly">
                            <button onclick="copyToClipboard('cidOnly')" class="btn btn-sm btn-outline">Copy</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;

    document.getElementById('detailsModal').classList.add('modal-open');
}

function closeDetailsModal() {
    document.getElementById('detailsModal').classList.remove('modal-open');
    selectedImage = null;
}

async function deleteImage(imageId) {
    if (!confirm('Are you sure you want to delete this image?')) {
        return;
    }

    try {
        const response = await fetch(`/api/attachments/${imageId}`, {
            method: 'DELETE'
        });

        const data = await response.json();

        if (data.success) {
            showToast('Image deleted successfully', 'success');
            loadImages();
        } else {
            showToast(data.error || 'Failed to delete image', 'error');
        }
    } catch (error) {
        console.error('Delete error:', error);
        showToast('Error deleting image', 'error');
    }
}

function copyToClipboard(elementId) {
    const input = document.getElementById(elementId);
    input.select();
    document.execCommand('copy');
    showToast('Copied to clipboard!', 'success');
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
}

function formatUsageType(type) {
    const types = {
        'all': 'All Templates',
        'email': 'Email Templates',
        'ticket': 'Tickets',
        'token': 'Tokens'
    };
    return types[type] || type;
}

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `alert alert-${type} fixed top-4 right-4 w-auto max-w-md z-50 shadow-lg`;
    toast.innerHTML = `
        <span>${message}</span>
    `;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 3000);
}
</script>
{% endblock %}
