<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard - GateKeeper{% endblock %}</title>
    
    <!-- TailwindCSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Note: Tailwind CDN warning is expected in development. For production, use a built version via PostCSS or Tailwind CLI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <style>
        .drawer-toggle:checked ~ .drawer-side {
            pointer-events: auto;
            visibility: visible;
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="drawer lg:drawer-open">
        <input id="admin-drawer" type="checkbox" class="drawer-toggle" />
        
        <!-- Main Content Area -->
        <div class="drawer-content flex flex-col">
            <!-- Top Navbar -->
            <div class="w-full navbar bg-base-300 shadow-lg">
                <div class="flex-none lg:hidden">
                    <label for="admin-drawer" class="btn btn-square btn-ghost">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-6 h-6 stroke-current">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </label>
                </div>
                
                <div class="flex-1 px-2 mx-2">
                    <h1 class="text-xl font-bold">{% block page_title %}Admin Dashboard{% endblock %}</h1>
                </div>
                
                <div class="flex-none">
                    <!-- User Dropdown -->
                    <div class="dropdown dropdown-end">
                        <label tabindex="0" class="btn btn-ghost btn-circle avatar placeholder">
                            <div class="bg-neutral-focus text-neutral-content rounded-full w-10">
                                <span class="text-xl">A</span>
                            </div>
                        </label>
                        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                            <li class="menu-title">
                                <span>Admin User</span>
                            </li>
                            <li>
                                <a href="#" id="theme-toggle" class="flex items-center gap-2">
                                    <svg id="theme-icon-light" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                                    </svg>
                                    <svg id="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                                    </svg>
                                    <span id="theme-text">Light Mode</span>
                                </a>
                            </li>
                            <li><a href="/admin/settings">Settings</a></li>
                            <li><a id="navLogoutBtn" href="#" class="logout-btn" data-action="logout">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- Page Content -->
            <div class="flex-1 p-4 lg:p-6">
                <!-- Breadcrumb -->
                {% block breadcrumb %}{% endblock %}
                
                <!-- Alert Messages -->
                <div x-data="{ show: false, message: '', type: 'success' }" 
                     x-show="show"
                     x-transition
                     @show-alert.window="show = true; message = $event.detail.message; type = $event.detail.type; setTimeout(() => show = false, 5000)"
                     class="mb-4">
                    <div :class="{
                        'alert-success': type === 'success',
                        'alert-error': type === 'error',
                        'alert-warning': type === 'warning',
                        'alert-info': type === 'info'
                    }" class="alert shadow-lg">
                        <span x-text="message"></span>
                    </div>
                </div>
                
                <!-- Main Content Block -->
                {% block content %}{% endblock %}
            </div>
        </div>
        
        <!-- Sidebar -->
        {% include 'admin/components/nav.html' %}
    </div>
    
    <!-- Custom JS -->
    <script>
        // Define logout function globally FIRST
        window.handleLogout = async function() {
            console.log('Logout function called');
            try {
                console.log('Calling logout API...');
                const response = await fetch('/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                console.log('Logout API response:', response.status);

                if (response.ok) {
                    console.log('Logout successful, redirecting to login...');
                    window.location.href = '/login';
                } else {
                    console.error('Logout API failed with status:', response.status);
                    // Force redirect anyway
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Logout error:', error);
                // Force redirect anyway
                window.location.href = '/login';
            }
        };

        // Make sure function is available immediately
        console.log('handleLogout function defined globally:', typeof window.handleLogout);

        // Attach logout handlers to all logout buttons
function attachLogoutHandlers() {
            // Handle all logout buttons by ID and class
            const logoutSelectors = [
                '#navLogoutBtn',    // Navbar dropdown
                '#logoutBtn',       // Sidebar
                'a[href*="logout"]', // Any link with logout
                '.logout-btn',      // Any logout button class
                '[data-action="logout"]' // Any element with logout action
            ];

            let handlersAttached = 0;

            logoutSelectors.forEach((selector, index) => {
                const elements = document.querySelectorAll(selector);

                elements.forEach((element, elemIndex) => {
                    if (!element.hasAttribute('data-logout-handler')) {
                        element.addEventListener('click', function(e) {
                            e.preventDefault();
                            window.handleLogout();
                        });
                        element.setAttribute('data-logout-handler', 'true');
                        handlersAttached++;
                    }
                });
            });

            // Also handle text-based logout detection
            const allLinks = document.querySelectorAll('a');
            allLinks.forEach(link => {
                if (link.textContent.toLowerCase().includes('logout') &&
                    !link.hasAttribute('data-logout-handler')) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        window.handleLogout();
                    });
                    link.setAttribute('data-logout-handler', 'true');
                    handlersAttached++;
                }
            });

            if (handlersAttached === 0) {
                console.warn('No logout buttons found');
            }
            return handlersAttached;
        }
        // Attach handlers when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, attaching logout handlers...');
            const count = attachLogoutHandlers();

            if (count === 0) {
                console.warn('No logout buttons found on initial load');
            }

            // Re-scan for logout buttons every 2 seconds (in case they're added dynamically)
            setInterval(function() {
                const additionalCount = attachLogoutHandlers();
                if (additionalCount > 0) {
                    console.log('Found and attached additional logout buttons:', additionalCount);
                }
            }, 2000);
        });

        // Also try to attach immediately (in case DOM is already loaded)
        if (document.readyState === 'loading') {
            console.log('Document still loading, will wait for DOMContentLoaded');
        } else {
            console.log('Document already loaded, attaching handlers immediately');
            setTimeout(attachLogoutHandlers, 100);
        }

        // Global alert function
        function showAlert(message, type = 'success') {
            window.dispatchEvent(new CustomEvent('show-alert', {
                detail: { message, type }
            }));
        }

        // Enhanced authFetch function for API calls
        async function authFetch(url, options = {}) {
            // Don't set Content-Type for FormData - browser will set it with boundary
            const isFormData = options.body instanceof FormData;
            
            const defaultOptions = {
                headers: isFormData ? {} : {
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            };

            const finalOptions = { ...defaultOptions, ...options };

            try {
                const response = await fetch(url, finalOptions);
                return response;
            } catch (error) {
                console.error('authFetch error:', error);
                throw error;
            }
        }
        
        // Make functions globally accessible IMMEDIATELY (before Alpine.js initializes)
        window.handleLogout = handleLogout;
        window.showAlert = showAlert;
        window.authFetch = authFetch;

        // Log function availability for debugging
        console.log('Global functions initialized:', {
            handleLogout: typeof window.handleLogout,
            showAlert: typeof window.showAlert,
            authFetch: typeof window.authFetch
        });

        // Theme Management Functions
        window.themeManager = {
            // Get current theme from localStorage or default to light
            getTheme: function() {
                return localStorage.getItem('app-theme') || 'light';
            },
            
            // Set theme
            setTheme: function(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('app-theme', theme);
                this.updateThemeUI(theme);
                this.saveThemePreference(theme);
            },
            
            // Update theme UI elements
            updateThemeUI: function(theme) {
                const themeIconLight = document.getElementById('theme-icon-light');
                const themeIconDark = document.getElementById('theme-icon-dark');
                const themeText = document.getElementById('theme-text');
                
                if (themeIconLight && themeIconDark && themeText) {
                    if (theme === 'dark') {
                        themeIconLight.classList.add('hidden');
                        themeIconDark.classList.remove('hidden');
                        themeText.textContent = 'Dark Mode';
                    } else {
                        themeIconLight.classList.remove('hidden');
                        themeIconDark.classList.add('hidden');
                        themeText.textContent = 'Light Mode';
                    }
                }
            },
            
            // Toggle theme
            toggleTheme: function() {
                const currentTheme = this.getTheme();
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                this.setTheme(newTheme);
            },
            
            // Save theme preference to backend
            saveThemePreference: async function(theme) {
                try {
                    const response = await fetch('/api/settings/theme', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ theme: theme })
                    });
                    
                    if (!response.ok && response.status !== 401) {
                        console.warn('Failed to save theme preference to server');
                    }
                } catch (error) {
                    // Silently fail - user might not be authenticated or server unavailable
                    console.debug('Could not save theme preference:', error);
                }
            },
            
            // Load theme preference from backend
            loadThemePreference: async function() {
                try {
                    const response = await fetch('/api/settings/theme');
                    if (response.ok) {
                        const data = await response.json();
                        if (data.theme) {
                            this.setTheme(data.theme);
                            return;
                        }
                    }
                } catch (error) {
                    // Fall back to localStorage
                    console.debug('Could not load theme preference from server:', error);
                }
                
                // Use localStorage theme
                const theme = this.getTheme();
                this.setTheme(theme);
            },
            
            // Initialize theme on page load
            init: function() {
                // Load theme preference
                this.loadThemePreference();
                
                // Attach click handler to theme toggle
                const themeToggle = document.getElementById('theme-toggle');
                if (themeToggle) {
                    themeToggle.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.toggleTheme();
                    });
                }
            }
        };

        // Initialize theme when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                window.themeManager.init();
            });
        } else {
            window.themeManager.init();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
