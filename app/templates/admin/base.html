<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard - GateKeeper{% endblock %}</title>
    
    <!-- TailwindCSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.0/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <style>
        .drawer-toggle:checked ~ .drawer-side {
            pointer-events: auto;
            visibility: visible;
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="drawer lg:drawer-open">
        <input id="admin-drawer" type="checkbox" class="drawer-toggle" />
        
        <!-- Main Content Area -->
        <div class="drawer-content flex flex-col">
            <!-- Top Navbar -->
            <div class="w-full navbar bg-base-300 shadow-lg">
                <div class="flex-none lg:hidden">
                    <label for="admin-drawer" class="btn btn-square btn-ghost">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-6 h-6 stroke-current">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </label>
                </div>
                
                <div class="flex-1 px-2 mx-2">
                    <h1 class="text-xl font-bold">{% block page_title %}Admin Dashboard{% endblock %}</h1>
                </div>
                
                <div class="flex-none">
                    <!-- User Dropdown -->
                    <div class="dropdown dropdown-end">
                        <label tabindex="0" class="btn btn-ghost btn-circle avatar placeholder">
                            <div class="bg-neutral-focus text-neutral-content rounded-full w-10">
                                <span class="text-xl">A</span>
                            </div>
                        </label>
                        <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
                            <li class="menu-title">
                                <span>Admin User</span>
                            </li>
                            <li><a href="/admin/settings">Settings</a></li>
                            <li><a id="navLogoutBtn" href="#" class="logout-btn" data-action="logout">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <!-- Page Content -->
            <div class="flex-1 p-4 lg:p-6">
                <!-- Breadcrumb -->
                {% block breadcrumb %}{% endblock %}
                
                <!-- Alert Messages -->
                <div x-data="{ show: false, message: '', type: 'success' }" 
                     x-show="show"
                     x-transition
                     @show-alert.window="show = true; message = $event.detail.message; type = $event.detail.type; setTimeout(() => show = false, 5000)"
                     class="mb-4">
                    <div :class="{
                        'alert-success': type === 'success',
                        'alert-error': type === 'error',
                        'alert-warning': type === 'warning',
                        'alert-info': type === 'info'
                    }" class="alert shadow-lg">
                        <span x-text="message"></span>
                    </div>
                </div>
                
                <!-- Main Content Block -->
                {% block content %}{% endblock %}
            </div>
        </div>
        
        <!-- Sidebar -->
        {% include 'admin/components/nav.html' %}
    </div>
    
    <!-- Custom JS -->
    <script>
        // Define logout function globally FIRST
        window.handleLogout = async function() {
            console.log('Logout function called');
            try {
                console.log('Calling logout API...');
                const response = await fetch('/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                console.log('Logout API response:', response.status);

                if (response.ok) {
                    console.log('Logout successful, redirecting to login...');
                    window.location.href = '/login';
                } else {
                    console.error('Logout API failed with status:', response.status);
                    // Force redirect anyway
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Logout error:', error);
                // Force redirect anyway
                window.location.href = '/login';
            }
        };

        // Make sure function is available immediately
        console.log('handleLogout function defined globally:', typeof window.handleLogout);

        // Attach logout handlers to all logout buttons
        function attachLogoutHandlers() {
            console.log('Attaching logout handlers...');

            // Handle all logout buttons by ID and class
            const logoutSelectors = [
                '#navLogoutBtn',    // Navbar dropdown
                '#logoutBtn',       // Sidebar
                'a[href*="logout"]', // Any link with logout
                '.logout-btn',      // Any logout button class
                '[data-action="logout"]' // Any element with logout action
            ];

            let handlersAttached = 0;

            logoutSelectors.forEach((selector, index) => {
                const elements = document.querySelectorAll(selector);
                console.log(`Selector "${selector}" found ${elements.length} elements`);

                elements.forEach((element, elemIndex) => {
                    if (!element.hasAttribute('data-logout-handler')) {
                        console.log(`Attaching handler to element ${elemIndex + 1} for selector "${selector}"`);
                        element.addEventListener('click', function(e) {
                            e.preventDefault();
                            console.log('Logout button clicked:', selector);
                            window.handleLogout();
                        });
                        element.setAttribute('data-logout-handler', 'true');
                        handlersAttached++;
                    }
                });
            });

            // Also handle text-based logout detection
            const allLinks = document.querySelectorAll('a');
            allLinks.forEach(link => {
                if (link.textContent.toLowerCase().includes('logout') &&
                    !link.hasAttribute('data-logout-handler')) {
                    console.log('Found text-based logout link:', link.textContent.trim());
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        console.log('Text-based logout clicked');
                        window.handleLogout();
                    });
                    link.setAttribute('data-logout-handler', 'true');
                    handlersAttached++;
                }
            });

            console.log(`Total logout handlers attached: ${handlersAttached}`);
            return handlersAttached;
        }

        // Attach handlers when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, attaching logout handlers...');
            const count = attachLogoutHandlers();

            if (count === 0) {
                console.warn('No logout buttons found on initial load');
            }

            // Re-scan for logout buttons every 2 seconds (in case they're added dynamically)
            setInterval(function() {
                const additionalCount = attachLogoutHandlers();
                if (additionalCount > 0) {
                    console.log('Found and attached additional logout buttons:', additionalCount);
                }
            }, 2000);
        });

        // Also try to attach immediately (in case DOM is already loaded)
        if (document.readyState === 'loading') {
            console.log('Document still loading, will wait for DOMContentLoaded');
        } else {
            console.log('Document already loaded, attaching handlers immediately');
            setTimeout(attachLogoutHandlers, 100);
        }

        // Global alert function
        function showAlert(message, type = 'success') {
            window.dispatchEvent(new CustomEvent('show-alert', {
                detail: { message, type }
            }));
        }
        
        // Enhanced authFetch function for API calls
        async function authFetch(url, options = {}) {
            const defaultOptions = {
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                }
            };

            const finalOptions = { ...defaultOptions, ...options };

            try {
                const response = await fetch(url, finalOptions);
                return response;
            } catch (error) {
                console.error('authFetch error:', error);
                throw error;
            }
        }

        // Make functions globally accessible
        window.showAlert = showAlert;
        window.authFetch = authFetch;

        // Note: window.handleLogout is already defined above, no need to reassign

        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
