<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Button Test</title>
    <style>
        .disabled { opacity: 0.5; pointer-events: none; }
        .form { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; }
        .field { margin-bottom: 15px; }
        input, button { width: 100%; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="form">
        <h2>Login Button Test</h2>
        <p>Type in both fields to see if button becomes enabled</p>

        <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>

        <div class="field">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <button id="loginBtn" class="disabled">Sign In (Disabled)</button>

        <div id="status" style="margin-top: 10px;"></div>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const status = document.getElementById('status');

        function checkFormValidity() {
            const isValid = emailInput.value.trim() && passwordInput.value.trim();

            if (isValid) {
                loginBtn.disabled = false;
                loginBtn.classList.remove('disabled');
                loginBtn.textContent = 'Sign In (Enabled)';
                status.innerHTML = '<span class="success">✅ Button is now enabled</span>';
            } else {
                loginBtn.disabled = true;
                loginBtn.classList.add('disabled');
                loginBtn.textContent = 'Sign In (Disabled)';
                status.innerHTML = '<span class="error">❌ Fill both fields to enable button</span>';
            }
        }

        emailInput.addEventListener('input', checkFormValidity);
        passwordInput.addEventListener('input', checkFormValidity);

        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!loginBtn.disabled) {
                status.innerHTML = '<span class="success">✅ Button clicked successfully!</span>';
            }
        });

        // Initial check
        checkFormValidity();
    </script>
</body>
</html>
