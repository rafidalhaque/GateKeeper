services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - ${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gatekeeper-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    networks:
      - gatekeeper-network
    expose:
      - ${REDIS_PORT}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask application
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "5010:5010"
    environment:
      - FLASK_ENV=production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatekeeper-network
    volumes:
      - ./uploads:/app/uploads
      - ./tmp:/app/tmp

  # Celery worker
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - FLASK_ENV=production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatekeeper-network
    volumes:
      - ./uploads:/app/uploads
      - ./tmp:/app/tmp
    command: celery -A app.celery_app worker --loglevel=info

  # Celery beat (for scheduled tasks)
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://gatekeeper:gatekeeper_password@postgres:5432/gatekeeper
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gatekeeper-network
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:


networks:
  gatekeeper-network:
    driver: bridge
